<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jaap Counter</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
</head>
<body>
    <section class="section">

    <div class="container">
        <div class="columns">
            <div class="column is-half is-offset-one-quarter">
                <div class="card">

                    <div class="card-image">
                        <figure class="image is-2by1">
                            <img src="Hare_Krshna_(Mahamantra).png" alt="Mahamantra">
                        </figure>
                    </div>

  <header class="card-header">
    <p class="card-header-title">Naam Jaap Counter</p>
    <button class="card-header-icon" aria-label="more options">
      <span class="icon">
        <i class="fas fa-angle-down" aria-hidden="true"></i>
      </span>
    </button>
  </header>
  <div class="card-content">
    <div class="content">
      <h2 id="counter" class="title is-1">0</h2>
        <p class="subtitle">Use the buttons below to keep track of your jaap</p>
        <label for="roundsIntended" class="label is-large is-inline">
            Rounds length
        </label>
        <div class="select is-rounded">
            <select name="" id="roundsIntended">
            <option value="108">108</option>
            <option value="27">27</option>
            <option value="7">7</option>
        </select>
        </div>
        <h3 class="title-4">Rounds done = <span id="roundsDone">0</span></h3>
    </div>
  </div>
  <footer class="card-footer">
    <button class="is-primary button card-footer-item" id="jaapButton"> +1 Jaap</button>
    <button class="is-danger button card-footer-item" id="reset"> Reset </button>
    
  </footer>
</div>
            </div>
        </div>

    </div>
    </section>


    <!-- <h1>Jaap Counter</h1> -->
    <!-- <h2 id="counter">0</h2> -->
    <!-- <button id="jaapButton">+1 Jaap</button> -->
    <!-- <button id="reset">Reset</button> -->
    
    

    <script src="app.js"></script>
</body>
</html>
